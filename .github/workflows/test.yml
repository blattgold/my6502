name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Download deps
      run: sudo apt-get install curl tar
    - name: Download tests
      run: ./setup_tests.sh
    - name: Run tests
      run: cargo test --verbose
